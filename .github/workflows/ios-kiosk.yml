name: iOS kiosk app (Chấm công)
# Builds the counter-phone app as an unsigned, fakesigned IPA for TrollStore (no Apple account).
# Artifact "ChamCong-ipa". The app only shows the QR page (the owner dropped the face check).
on:
  push:
    branches: [ios-kiosk-app, developer]
    paths: ['ios/**', '.github/workflows/ios-kiosk.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-kiosk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'tiendao22289/WebBanHang'
    # Xcode 16 (XcodeGen from Homebrew writes the Xcode 16 project format).
    runs-on: macos-15
    timeout-minutes: 30
    env:
      APP: ios/build/Build/Products/Release-iphoneos/ChamCong.app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install XcodeGen and ldid
        run: |
          brew install xcodegen ldid
          xcodebuild -version
          xcodegen --version

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (Release, iPhone, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project ios/ChamCong.xcodeproj -scheme ChamCong -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee /tmp/xcodebuild.log | grep -E "error:|warning: .*Swift|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" /tmp/xcodebuild.log

      - name: Fakesign, check and package the IPA
        run: |
          ldid -S "$APP/ChamCong"
          min=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")
          echo "MinimumOSVersion $min"; test "$min" = "15.0"
          lipo -info "$APP/ChamCong"; lipo -info "$APP/ChamCong" | grep -q arm64
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -qx online.ocbaokhang.chamcong
          /usr/libexec/PlistBuddy -c 'Print :KioskURL' "$APP/Info.plist"
          if /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$APP/Info.plist" 2>/dev/null; then echo "camera permission should be gone"; exit 1; fi
          ls "$APP"
          rm -rf /tmp/ipa && mkdir -p /tmp/ipa/Payload && cp -R "$APP" /tmp/ipa/Payload/
          (cd /tmp/ipa && zip -qry ChamCong.ipa Payload)
          mv /tmp/ipa/ChamCong.ipa ios/build/ChamCong.ipa
          ls -la ios/build/ChamCong.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ChamCong-ipa
          path: ios/build/ChamCong.ipa
          if-no-files-found: error
