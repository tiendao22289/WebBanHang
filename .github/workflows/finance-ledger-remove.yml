name: Finance Ledger Remove
# Chạy tay: bỏ MỘT bill khỏi Sổ thu chi (khớp ngày + 8 ký tự đầu mã bill + số tiền).
on:
  workflow_dispatch:
    inputs:
      date: { description: 'Ngày YYYY-MM-DD', required: true }
      order_prefix: { description: '8 ký tự đầu mã bill', required: true }
      amount: { description: 'Số tiền (đồng)', required: true }
permissions:
  contents: read
concurrency:
  group: local-production
  cancel-in-progress: false
jobs:
  remove:
    if: github.ref == 'refs/heads/master' && github.repository == 'tiendao22289/WebBanHang'
    runs-on: [self-hosted, Windows, X64, webbanhang-production]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Remove one ledger bill
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          R_DATE: ${{ inputs.date }}
          R_PREFIX: ${{ inputs.order_prefix }}
          R_AMOUNT: ${{ inputs.amount }}
        run: |
          & node scripts/finance-ledger-remove.cjs 'C:\Tool\SupabaseLocal\production.env' "$env:R_DATE" "$env:R_PREFIX" "$env:R_AMOUNT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
