name: Apply Finance Migration
# Chạy tay (Actions → Apply Finance Migration → Run workflow). Cài
# supabase/migrations/owner_finance.sql vào DB thật trên máy chủ quán.
# Không chạy theo push/PR. Chạy lại được nhiều lần.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: local-production
  cancel-in-progress: false
jobs:
  migrate:
    if: github.ref == 'refs/heads/master' && github.repository == 'tiendao22289/WebBanHang'
    runs-on: [self-hosted, Windows, X64, webbanhang-production]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Apply owner_finance.sql to production
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          & node scripts/apply-finance-migration.cjs 'C:\Tool\SupabaseLocal\production.env'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
