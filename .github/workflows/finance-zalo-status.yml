name: Finance Zalo Status
# Chạy tay: xem liên kết báo cáo Zalo trên DB thật (chỉ đọc, không in bí mật).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    if: github.ref == 'refs/heads/master' && github.repository == 'tiendao22289/WebBanHang'
    runs-on: [self-hosted, Windows, X64, webbanhang-production]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Show Zalo report link status
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          & node scripts/finance-zalo-status.cjs 'C:\Tool\SupabaseLocal\production.env'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
